server:
  http_listen_port: 9080
  grpc_listen_port: 9097

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: springboot-app
    static_configs:
      - targets: [localhost]
        labels:
          job: springboot-app
          __path__: /var/log/testapp/app.log

  - job_name: failover
    static_configs:
      - targets: [localhost]
        labels:
          job: failover
          __path__: /var/log/devops-infra/failover.log
