groups:
  - name: app_alerts
    rules:
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 93600
        labels:
          severity: critical
        annotations:
          summary: "No confirmed backup for more than 26h"

      - alert: AppDown
        expr: probe_success{job="blackbox"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is not responding (blackbox probe)"

      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL is not responding"
